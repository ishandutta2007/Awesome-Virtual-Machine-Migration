<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    /* Dynamic Animated Elements in Background/Edges */
    @keyframes pulseParticle {
      0% { r: 4px; opacity: 0.3; }
      50% { r: 8px; opacity: 0.8; }
      100% { r: 4px; opacity: 0.3; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-20px); }
      100% { transform: translateX(0px); }
    }
    .p1 { animation: pulseParticle 3s infinite ease-in-out; }
    .p2 { animation: pulseParticle 4s infinite ease-in-out 1s; }
    .p3 { animation: pulseParticle 3.5s infinite ease-in-out 0.5s; }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 12s linear infinite;
    }
    .wave-bg {
      animation: waveMove 6s infinite ease-in-out;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />
  
  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad)" />
  <circle cx="1050" cy="280" r="160" fill="url(#glowGrad)" />

  <!-- Animated Background Flow Connections & Nodes (Kept behind & at edges) -->
  <g class="wave-bg" opacity="0.4">
    <!-- Server Node 1 -->
    <rect x="850" y="60" width="110" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="905" y="90" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">VMware ESXi</text>
    
    <!-- Migration Arrow Connection -->
    <path d="M 905 110 L 905 160 Q 905 180 925 180 L 985 180 Q 1005 180 1005 200 L 1005 240" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" />
    
    <!-- Target Cloud Node -->
    <rect x="950" y="240" width="110" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="1005" y="270" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">KVM / Cloud</text>
  </g>

  <!-- Animated Glowing Dynamic Particles -->
  <circle cx="850" cy="180" r="6" fill="#38bdf8" class="p1" filter="url(#glow)" />
  <circle cx="950" cy="100" r="5" fill="#818cf8" class="p2" filter="url(#glow)" />
  <circle cx="1080" cy="140" r="7" fill="#c084fc" class="p3" filter="url(#glow)" />
  <circle cx="100" cy="280" r="6" fill="#38bdf8" class="p2" filter="url(#glow)" />

  <!-- Bottom Accent Bar -->
  <rect x="0" y="352" width="1200" height="8" fill="url(#accentGrad)" rx="4"/>

  <!-- Foreground Content Group (Clear of dynamic elements) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="70" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="115" y="91" text-anchor="middle" class="badge-text">⚡ ENTERPRISE &amp; OPEN-SOURCE</text>

    <!-- Main Title -->
    <text x="0" y="160" class="title" filter="url(#glow)">Awesome Virtual Machine</text>
    <text x="0" y="215" class="title" fill="url(#accentGrad)">Migration Ecosystem 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">Curated SaaS Platforms, V2V Tools, Hypervisor Drivers &amp; Cloud Workload Mobility</text>
  </g>
</svg>
